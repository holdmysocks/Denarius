name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: denarius
          POSTGRES_USER: denarius
          POSTGRES_PASSWORD: denarius_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U denarius -d denarius"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://denarius:denarius_ci@localhost:5432/denarius
      JWT_SECRET: ci-only-secret-not-used-outside-tests
      RUN_DATABASE_TESTS: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply database migrations
        run: |
          alembic upgrade head
          alembic current
      - name: Run unit and PostgreSQL integration tests
        run: python -m unittest discover -s tests -t . -v
      - name: Smoke-test application lifespan and scheduler registration
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/denarius-uvicorn.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/system/health > /tmp/health.json; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/denarius-uvicorn.log
              exit 1
            fi
            sleep 1
          done
          python -c 'import json; assert json.load(open("/tmp/health.json")) == {"status": "ok", "db": "ok"}'
          tokens=$(curl --fail --silent -X POST http://127.0.0.1:8000/api/v1/auth/register -H 'Content-Type: application/json' -d '{"username":"ci_lifespan","email":"ci-lifespan@example.com","password":"ci-password-123"}')
          access_token=$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$tokens")
          curl --fail --silent -X POST http://127.0.0.1:8000/api/v1/auth/claim-admin -H "Authorization: Bearer $access_token" > /tmp/admin.json
          curl --fail --silent http://127.0.0.1:8000/api/v1/system/jobs -H "Authorization: Bearer $access_token" > /tmp/jobs.json
          python -c 'import json; assert {job["id"] for job in json.load(open("/tmp/jobs.json"))} == {"auto_post_recurring", "budget_rollover", "net_worth_snapshot"}'
          kill "$server_pid"
          wait "$server_pid" || true
          trap - EXIT
      - name: Compile application
        run: python -m compileall -q app
      - name: Import application
        run: python -c "import app.main"
      - name: Validate Docker Compose configuration
        run: docker compose -f ../docker-compose.yml config --quiet

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Type-check and build
        run: npm run build
